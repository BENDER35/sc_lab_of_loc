stages:
  - mirror

mirror_to_github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - when: never
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      set -eu
      if [ -z "${GITHUB_MIRROR_URL:-}" ]; then
        echo "Missing CI/CD variable GITHUB_MIRROR_URL" >&2
        exit 1
      fi
      # Loop guard: skip if last commit message contains [skip-mirror]
      MSG=$(git log -1 --pretty=%B)
      echo "$MSG" | grep -q '\[skip-mirror\]' && echo "skip-mirror detected" && exit 0
      git remote add github "$GITHUB_MIRROR_URL" || git remote set-url github "$GITHUB_MIRROR_URL"
      git fetch --all --tags
      git push --prune github +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*
