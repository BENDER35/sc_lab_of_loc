title: Suspicious Child Process Spawned By Microsoft Office
id: 7d2b3d2e-2d7a-4d6f-bf2e-9f4f8f1f2a10
status: experimental
description: Detects common suspicious child processes spawned by Office applications. Educational starter rule; tune for your environment.
author: SC Lab of LOC
date: 2026-11-25
references:
  - https://attack.mitre.org/techniques/T1204/002/
tags:
  - attack.initial_access
  - attack.t1204.002
  - attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate administrative automation
  - Add-ins or enterprise macros with signed/trusted behavior
level: medium
